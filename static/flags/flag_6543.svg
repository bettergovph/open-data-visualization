<svg width="100" height="60" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .flag-slice { stroke: #333; stroke-width: 0.5; }
            .flag-symbol { fill: #000; stroke: #fff; stroke-width: 0.5; }
        </style>
    </defs>
    <polygon points="0.0,0 50.0,0 25.0,60" fill="#4ECDC4" class="flag-slice"/>
    <polygon points="50.0,0 100.0,0 75.0,60" fill="#45B7D1" class="flag-slice"/>
    <g class="flag-symbol">
        <line x1="35" y1="30" x2="65" y2="30"/>
        <line x1="50" y1="15" x2="50" y2="45"/>
    </g>
</svg>