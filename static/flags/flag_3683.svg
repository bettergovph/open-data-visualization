<svg width="100" height="60" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .flag-slice { stroke: #333; stroke-width: 0.5; }
            .flag-symbol { fill: #000; stroke: #fff; stroke-width: 0.5; }
        </style>
    </defs>
    <polygon points="0.0,0 50.0,0 25.0,60" fill="#FF6B6B" class="flag-slice"/>
    <polygon points="50.0,0 100.0,0 75.0,60" fill="#4ECDC4" class="flag-slice"/>
    <circle cx="50" cy="30" r="15" class="flag-symbol"/>
</svg>