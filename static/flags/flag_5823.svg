<svg width="100" height="60" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .flag-slice { stroke: #333; stroke-width: 0.5; }
            .flag-symbol { fill: #000; stroke: #fff; stroke-width: 0.5; }
        </style>
    </defs>
    <polygon points="0.0,0 20.0,0 10.0,60" fill="#F7DC6F" class="flag-slice"/>
    <polygon points="20.0,0 40.0,0 30.0,60" fill="#BB8FCE" class="flag-slice"/>
    <polygon points="40.0,0 60.0,0 50.0,60" fill="#85C1E9" class="flag-slice"/>
    <polygon points="60.0,0 80.0,0 70.0,60" fill="#FF9F43" class="flag-slice"/>
    <polygon points="80.0,0 100.0,0 90.0,60" fill="#6C5CE7" class="flag-slice"/>
    <polygon points="50,15 65,45 35,45" class="flag-symbol"/>
</svg>