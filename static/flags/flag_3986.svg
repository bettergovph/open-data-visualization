<svg width="100" height="60" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .flag-slice { stroke: #333; stroke-width: 0.5; }
            .flag-symbol { fill: #000; stroke: #fff; stroke-width: 0.5; }
        </style>
    </defs>
    <polygon points="0.0,0 33.333333333333336,0 16.666666666666668,60" fill="#45B7D1" class="flag-slice"/>
    <polygon points="33.333333333333336,0 66.66666666666667,0 50.0,60" fill="#96CEB4" class="flag-slice"/>
    <polygon points="66.66666666666667,0 100.0,0 83.33333333333334,60" fill="#FFEAA7" class="flag-slice"/>
    <g class="flag-symbol">
        <line x1="35" y1="30" x2="65" y2="30"/>
        <line x1="50" y1="15" x2="50" y2="45"/>
    </g>
</svg>