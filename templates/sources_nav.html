<style>
    body:has(.sources-page) > header.visualizations-mobile-header,
    body:has(.sources-page) > footer.visualizations-mobile-footer,
    body:has(.sources-page) > nav.navbar { display:none!important; }
    body:has(.sources-page) { margin:0!important; background:#FAFAFA!important; color:#212121!important; }
    .sources-page { --source-ink:#212121; --source-muted:#616161; --source-blue:#0038A8; --source-navy:#00246A; --source-yellow:#FCD116; --source-line:#E0E0E0; color:var(--source-ink); background:#FAFAFA; min-height:100vh; font-family:Inter,system-ui,sans-serif; }
    .sources-page .sources-content { max-width:1224px; min-height:calc(100vh - 68px); margin:0 auto; padding:30px 28px 64px; background:#FAFAFA; }
    .sources-page .sources-content-inner { max-width:none; margin:0; }
    .sources-page .source-section { margin:18px 0; padding:clamp(18px,3vw,30px); border:1px solid var(--source-line); border-radius:14px; background:#fff; box-shadow:0 4px 18px #00246A0A; }
    .sources-page .source-section h3 { color:var(--source-navy); font-size:clamp(19px,2.3vw,24px); line-height:1.3; }
    .sources-page .source-section p, .sources-page .source-section li { color:var(--source-ink); line-height:1.6; }
    .sources-page .source-list li { border-color:var(--source-line); }
    .sources-page .source-link, .sources-page .source-popup-item a { color:var(--source-blue); }
    .sources-page .source-link:hover, .sources-page .source-popup-item a:hover { color:var(--source-navy); }
    .sources-page :is(a,button):focus-visible { outline:3px solid var(--source-yellow); outline-offset:3px; }
    @media(max-width:800px) {
        .sources-page .sources-content { min-height:calc(100vh - 58px); padding:24px 12px 44px; }
    }
    @media(max-width:470px) { .sources-page .sources-content { padding:20px 12px 36px; } }
</style>
{% set topic_nav_active = "sources" %}
{% include "visualizations_topic_nav.html" %}
<section class="topic-hero" aria-labelledby="sources-page-title">
    <div class="topic-hero-inner">
        <p class="topic-hero-kicker">BetterGovPH · Research sources</p>
        <h1 id="sources-page-title">Data Sources</h1>
        <p class="topic-hero-deck">Primary records and reference datasets behind BetterGovPH budget and project analysis.</p>
    </div>
</section>
